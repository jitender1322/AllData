<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineWorld - HD Movie Downloads</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://kit.fontawesome.com/a2b3c6b1cd.js" crossorigin="anonymous"></script>
  <style>
    body {
      background: radial-gradient(circle at top, #0f172a, #000);
      color: #fff;
      font-family: 'Poppins', sans-serif;
    }
    .glass {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glow {
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
    }
    .card:hover {
      transform: scale(1.05);
      transition: 0.3s;
    }
    .fade-in {
      animation: fadeIn 1.2s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <header class="glass fixed top-0 left-0 w-full flex justify-between items-center px-6 py-3 z-50">
    <h1 class="text-3xl font-bold text-cyan-400">🎬 CineWorld</h1>
    <div class="flex items-center gap-3">
      <input id="searchBox" type="text" placeholder="Search movies..."
        class="px-3 py-2 rounded-md bg-gray-800 text-gray-100 outline-none focus:ring-2 focus:ring-cyan-400 w-48 sm:w-64" />
      <button class="bg-cyan-500 hover:bg-cyan-400 text-black font-semibold px-4 py-2 rounded-md glow transition">Search</button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="pt-24 pb-16 text-center fade-in">
    <h2 class="text-5xl font-extrabold text-cyan-400 mb-4">Download Movies in HD Quality</h2>
    <p class="text-gray-300 text-lg mb-8">Fast • Free • Full HD • Latest Releases</p>
    <a href="#movies" class="bg-cyan-500 hover:bg-cyan-400 text-black font-semibold px-6 py-3 rounded-md glow transition">Explore Now</a>
  </section>

  <!-- Filter Buttons -->
  <div class="flex justify-center flex-wrap gap-4 px-6">
    <button class="filter-btn bg-cyan-500 hover:bg-cyan-400 text-black px-4 py-2 rounded-md font-semibold glow" data-genre="all">All</button>
    <button class="filter-btn bg-gray-700 hover:bg-gray-600 text-cyan-400 px-4 py-2 rounded-md" data-genre="Action">Action</button>
    <button class="filter-btn bg-gray-700 hover:bg-gray-600 text-cyan-400 px-4 py-2 rounded-md" data-genre="Sci-Fi">Sci-Fi</button>
    <button class="filter-btn bg-gray-700 hover:bg-gray-600 text-cyan-400 px-4 py-2 rounded-md" data-genre="Drama">Drama</button>
    <button class="filter-btn bg-gray-700 hover:bg-gray-600 text-cyan-400 px-4 py-2 rounded-md" data-genre="Fantasy">Fantasy</button>
  </div>

  <!-- Movie Section -->
  <section id="movies" class="px-6 py-12">
    <div id="movieGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8 fade-in">
      <!-- Movie cards will appear here -->
    </div>
  </section>

  <!-- Footer -->
  <footer class="text-center py-6 bg-gray-900/60">
    <div class="flex justify-center gap-6 mb-3">
      <i class="fab fa-facebook text-cyan-400 hover:text-cyan-300"></i>
      <i class="fab fa-twitter text-cyan-400 hover:text-cyan-300"></i>
      <i class="fab fa-telegram text-cyan-400 hover:text-cyan-300"></i>
    </div>
    <p class="text-gray-500 text-sm">© 2025 CineWorld. All rights reserved.</p>
  </footer>

  <!-- JavaScript -->
  <script>
    const movies = [
      { title: "Deadpool & Wolverine", year: 2024, genre: "Action", img: "https://i.ibb.co/3Mx6dwr/deadpool-wolverine.jpg" },
      { title: "Interstellar", year: 2014, genre: "Sci-Fi", img: "https://i.ibb.co/znMT2j4/interstellar.jpg" },
      { title: "The Batman", year: 2022, genre: "Action", img: "https://i.ibb.co/3zG1vQn/batman.jpg" },
      { title: "Oppenheimer", year: 2023, genre: "Drama", img: "https://i.ibb.co/TKxzst2/oppenheimer.jpg" },
      { title: "Avatar: The Way of Water", year: 2022, genre: "Fantasy", img: "https://i.ibb.co/pbYq6nF/avatar2.jpg" },
      { title: "Dune Part Two", year: 2024, genre: "Sci-Fi", img: "https://i.ibb.co/xFHJ4Xb/dune2.jpg" },
      { title: "John Wick 4", year: 2023, genre: "Action", img: "https://i.ibb.co/QFFSmH9/johnwick4.jpg" },
      { title: "The Flash", year: 2023, genre: "Action", img: "https://i.ibb.co/GF8SRqT/flash.jpg" },
    ];

    const grid = document.getElementById("movieGrid");

    function renderMovies(filter = "all", search = "") {
      grid.innerHTML = "";
      movies
        .filter(m => (filter === "all" || m.genre === filter) && m.title.toLowerCase().includes(search.toLowerCase()))
        .forEach(movie => {
          const card = document.createElement("div");
          card.className = "card bg-gray-800 rounded-xl overflow-hidden shadow-lg hover:shadow-cyan-400/40 transition";
          card.innerHTML = `
            <img src="${movie.img}" alt="${movie.title}" class="w-full h-72 object-cover">
            <div class="p-4">
              <h3 class="text-xl font-bold text-cyan-300 mb-1">${movie.title}</h3>
              <p class="text-gray-400 mb-3">${movie.genre} • ${movie.year}</p>
              <button class="bg-cyan-500 hover:bg-cyan-400 text-black px-4 py-2 rounded-md font-semibold glow">Download</button>
            </div>`;
          grid.appendChild(card);
        });
    }

    renderMovies();

    document.getElementById("searchBox").addEventListener("input", (e) => {
      renderMovies(currentGenre, e.target.value);
    });

    let currentGenre = "all";
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("bg-cyan-500", "text-black"));
        btn.classList.add("bg-cyan-500", "text-black");
        currentGenre = btn.getAttribute("data-genre");
        renderMovies(currentGenre, document.getElementById("searchBox").value);
      });
    });
  </script>
</body>
</html>
